    <script>
        let currentUnit = 'F';

        const presets = [
            { name: "Chicken Breast", tempF: 400, time: 25, adj: 0.75 },
            { name: "Chicken Thighs", tempF: 400, time: 30, adj: 0.75 },
            { name: "French Fries", tempF: 425, time: 25, adj: 0.70 },
            { name: "Vegetables", tempF: 400, time: 18, adj: 0.80 },
            { name: "Cookies", tempF: 350, time: 12, adj: 0.80 },
            { name: "Fish / Salmon", tempF: 400, time: 12, adj: 0.75 },
            { name: "Roast", tempF: 375, time: 60, adj: 0.70 },
            { name: "Custom", tempF: 400, time: 30, adj: 0.75 }
        ];

        function setUnit(unit) {
            currentUnit = unit;
            document.getElementById('unitF').className = unit === 'F' 
                ? 'px-4 py-2 rounded-xl text-sm bg-orange-500 text-white' 
                : 'px-4 py-2 rounded-xl text-sm text-zinc-400';
            document.getElementById('unitC').className = unit === 'C' 
                ? 'px-4 py-2 rounded-xl text-sm bg-orange-500 text-white' 
                : 'px-4 py-2 rounded-xl text-sm text-zinc-400';
        }

        function loadPresets() {
            const container = document.getElementById('presets');
            container.innerHTML = '';
            presets.forEach((p, i) => {
                const btn = document.createElement('button');
                btn.className = `preset-btn px-3 py-2.5 text-sm border border-zinc-700 rounded-2xl text-left ${i===0 ? 'active' : 'bg-zinc-950'}`;
                btn.textContent = p.name;
                btn.onclick = () => {
                    document.querySelectorAll('#presets button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('ovenTemp').value = p.tempF;
                    document.getElementById('ovenTime').value = p.time;
                    calculateConversion(p);
                    showRelatedGuide(p.name);


                };
                container.appendChild(btn);
            });
        }

        function calculateConversion(preset = null) {
            const ovenTemp = parseFloat(document.getElementById('ovenTemp').value);
            const ovenTime = parseFloat(document.getElementById('ovenTime').value);
            if (!ovenTemp || !ovenTime) return alert('Please enter temperature and time');

            let tempReduction = 25;
            let mult = preset ? preset.adj : 0.75;

            let afTemp = ovenTemp - tempReduction;
            let afTime = Math.round(ovenTime * mult);

            if (currentUnit === 'C') afTemp = Math.round((afTemp - 32) * 5/9);

            document.getElementById('afTemp').textContent = afTemp + '°' + currentUnit;
            document.getElementById('afTime').textContent = afTime + ' min';
            document.getElementById('tips').innerHTML = `
                <strong class="text-orange-300">Pro tips:</strong><br>
                • Shake or flip halfway through<br>
                • Check 5–10 minutes early<br>
                • Don’t overcrowd the basket
            `;
            document.getElementById('results').classList.remove('hidden');
        }

        window.onload = () => {
            loadPresets();
            setUnit('F');
            setTimeout(() => document.querySelector('#presets button')?.click(), 300);
        };
       // Related guides mapping

  }
};

function showRelatedGuide(presetName) {
  const guide = relatedGuides[presetName];
  const container = document.getElementById('related-guide');
  const link = document.getElementById('related-guide-link');
  const title = document.getElementById('related-guide-title');

  if (guide) {
    link.href = guide.url;
    title.textContent = guide.title;
    container.classList.remove('hidden');
  } else {
    container.classList.add('hidden');
  }
}
