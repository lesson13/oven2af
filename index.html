<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oven2AF - Free Oven to Air Fryer Converter</title>
    <meta name="description" content="Convert any oven recipe to air fryer settings instantly. Free tool with smart presets and guides.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading-font { font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
        .modal { animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">

    <!-- Navbar, Hero, Converter, How it Works (same as your working version) -->
    <!-- Paste your previous sections here if you want to keep them exactly -->

    <!-- Blog Section -->
    <div id="blog" class="max-w-6xl mx-auto px-6 pb-20">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-bold tracking-tight heading-font">Air Fryer Guides & Recipes</h2>
            <p class="text-zinc-400 mt-3">Real conversions and expert tips</p>
        </div>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" id="blog-cards"></div>
    </div>

    <!-- Modal -->
    <div id="blog-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100] p-4">
        <div class="modal bg-zinc-900 border border-zinc-700 rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-auto">
            <div class="sticky top-0 bg-zinc-900 p-5 flex justify-between items-center border-b border-zinc-700">
                <h2 id="modal-title" class="font-bold text-2xl"></h2>
                <button onclick="closeModal()" class="text-4xl leading-none hover:text-orange-400">×</button>
            </div>
            <div id="modal-content" class="p-8 prose prose-invert max-w-none text-zinc-300"></div>
        </div>
    </div>

    <script>
        // === CONVERTER CODE (your existing one) ===
        // Paste all your converter JS here (presets, calculateConversion, etc.)

        const blogPosts = [
            {
                title: "The Ultimate Oven to Air Fryer Conversion Guide",
                readTime: "9 min read",
                excerpt: "Everything you need to know about converting oven recipes successfully.",
                content: `
                    <h3>Why You Need to Convert Recipes</h3>
                    <p>Air fryers cook with rapid hot air circulation, which is much more efficient than a conventional oven. This means recipes need adjustments in both temperature and time to avoid dry or burnt food.</p>
                    <h3>General Conversion Rules</h3>
                    <ul>
                        <li><strong>Temperature</strong>: Reduce by 20–30°F (10–15°C)</li>
                        <li><strong>Time</strong>: Reduce by 20–25% (up to 30% for crispy items)</li>
                    </ul>
                    <p>Always check food 5–10 minutes early. Every air fryer model is slightly different.</p>
                    <!-- Full detailed content would continue here -->
                `
            },
            {
                title: "Crispy Air Fryer Chicken Breast from Oven Recipe",
                readTime: "7 min read",
                excerpt: "Exact converted settings for juicy, crispy chicken every time.",
                content: `<p>Original oven: 400°F for 25 minutes. Air fryer: 375°F for 18–20 minutes. Flip halfway.</p>`
            },
            {
                title: "5 Common Mistakes When Converting Oven Recipes",
                readTime: "8 min read",
                excerpt: "Avoid soggy results, overcooking, and disappointment.",
                content: `<h3>Mistake #1: Not checking early</h3><p>...</p>`
            }
        ];

        function loadBlogCards() {
            const container = document.getElementById('blog-cards');
            container.innerHTML = '';
            blogPosts.forEach(post => {
                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden cursor-pointer hover:border-orange-500 transition-all group";
                card.innerHTML = `
                    <div class="h-2 bg-gradient-to-r from-orange-500 to-amber-500"></div>
                    <div class="p-6">
                        <div class="text-xs text-orange-400 mb-2">${post.readTime}</div>
                        <h3 class="font-semibold text-xl leading-tight mb-3 group-hover:text-orange-400">${post.title}</h3>
                        <p class="text-sm text-zinc-400 line-clamp-3">${post.excerpt}</p>
                    </div>
                `;
                card.onclick = () => openModal(post);
                container.appendChild(card);
            });
        }

        function openModal(post) {
            document.getElementById('modal-title').textContent = post.title;
            document.getElementById('modal-content').innerHTML = post.content;
            document.getElementById('blog-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('blog-modal').classList.add('hidden');
        }

        window.onload = function() {
            // Your converter init code...
            loadBlogCards();
        };
    </script>
</body>
</html>
